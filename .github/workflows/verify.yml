name: Verify

# The files here are the npm release named in plugin/.claude-plugin/plugin.json,
# built by zerostel/zerostel's release workflow: scripts/release.mjs checks
# the registry's signature, the provenance, and every file.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: The files match the npm release they name
        run: node scripts/release.mjs "$(node -p "require('./plugin/.claude-plugin/plugin.json').version")"
